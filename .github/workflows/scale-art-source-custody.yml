name: SCALE ART source custody
on:
  push:
    paths:
      - 'qa/scale-art/archive/SK_SCALE_0_3_S33_patch.zip'
      - 'qa/scale-art/tools/r1_c03_verify_archive.py'
      - '.github/workflows/scale-art-source-custody.yml'
  workflow_dispatch:
jobs:
  exact-source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact S33 archive and its 168 source members
        run: |
          python3 qa/scale-art/tools/r1_c03_verify_archive.py qa/scale-art/archive/SK_SCALE_0_3_S33_patch.zip
